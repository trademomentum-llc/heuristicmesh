; HeuristicMesh Unified ESP32 Firmware
; PlatformIO Configuration File
; 
; Supports: ESP32-S3, ESP32-S2-WROOM
; Sensors: AMG8833 ONLY (2x sensors in inventory)
; Protocol: Unified Binary Protocol v1.1
; 
; Author: HeuristicMesh Engineering Team
; Version: 1.1
; Date: 2026-08-29
; Note: MLX90640 support removed - only 2x AMG8833 sensors

[platformio]
default_envs = esp32-s3-devkitc-1, esp32-s2-wroom

; ============================================================================
; COMMON CONFIGURATION
; ============================================================================

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit AMG88xx @ ^1.1.1
    ; MLX90640 libraries removed - only AMG8833 sensors in inventory

; ============================================================================
; ESP32-S3 CONFIGURATION (Primary sensor nodes with AMG8833)
; ============================================================================

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram = enable
monitor_filters = esp32_exception_decoder
build_flags =
    ${common.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D DEVICE_TYPE=DEVICE_ESP32_S3

; Configuration for ESP32-S3 Node 1 (AMG8833 #1 at 0x69)
[env:esp32-s3-node1]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram = enable
build_flags =
    ${common.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D DEVICE_TYPE=DEVICE_ESP32_S3
    -D DEVICE_ID=1
    -D AMG_I2C_ADDR=0x69

; Configuration for ESP32-S3 Node 2 (AMG8833 #2 at 0x68)
[env:esp32-s3-node2]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram = enable
build_flags =
    ${common.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D DEVICE_TYPE=DEVICE_ESP32_S3
    -D DEVICE_ID=2
    -D AMG_I2C_ADDR=0x68

; Configuration for ESP32-S3 Node 3 (Standby, no sensor)
[env:esp32-s3-node3]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram = enable
build_flags =
    ${common.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D DEVICE_TYPE=DEVICE_ESP32_S3
    -D DEVICE_ID=3

; ============================================================================
; ESP32-S2-WROOM CONFIGURATION (Gateway/Serial-to-Ethernet via USR-TCP232)
; ============================================================================

[env:esp32-s2-wroom]
board = esp32-s2-wroom
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder
build_flags =
    ${common.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S2=1
    -D DEVICE_TYPE=DEVICE_ESP32_S2
    -D DEVICE_ID=4
    -D MODBUS_ENABLED=true

; ============================================================================
; BUILD OPTIONS
; ============================================================================

; Debug build
[env:esp32-s3-debug]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram = enable
debug_tool = vsdebug
debug_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${common.build_flags}
    -D CORE_DEBUG_LEVEL=4
    -D DEBUG_LEVEL=DEBUG_VERBOSE

; Release build
[env:esp32-s3-release]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram = enable
build_type = release
build_flags =
    ${common.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D DEBUG_LEVEL=DEBUG_ERROR
    -O2

; ============================================================================
; MONITOR CONFIGURATION
; ============================================================================

; For direct USB connection (921600 baud)
[env:monitor-usb-fast]
monitor_speed = 921600

; For USR-TCP232 connection (115200 baud)
[env:monitor-uart]
monitor_speed = 115200

; ============================================================================
; NOTES
; ============================================================================

; To build and upload for all 3 ESP32-S3 nodes:
;   pio run -e esp32-s3-node1 -t upload
;   pio run -e esp32-s3-node2 -t upload
;   pio run -e esp32-s3-node3 -t upload
;
; To build and upload for ESP32-S2 gateway:
;   pio run -e esp32-s2-wroom -t upload
;
; For debugging with serial monitor:
;   pio device monitor -e esp32-s3-node1 -b 921600
;
; For USR-TCP232 debugging:
;   pio device monitor -e esp32-s2-wroom -b 115200
