; HeuristicMesh Unified ESP32 Firmware
; PlatformIO Configuration File
; 
; Supports: ESP32-S3, ESP32-S2-WROOM
; Sensors: AMG8833, MLX90640
; Protocol: Unified Binary Protocol v1.0
; 
; Author: HeuristicMesh Engineering Team
; Version: 1.0
; Date: 2026-08-29

[platformio]
default_envs = esp32-s3-devkitc-1, esp32-s2-wroom

; ============================================================================
; COMMON CONFIGURATION
; ============================================================================

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit AMG88xx @ ^1.1.1
    ; Uncomment the MLX90640 library you're using:
    ; adafruit/Adafruit MLX90640 @ ^1.0.2
    sparkfun/SparkFun MLX90640 IR Array @ ^1.1.0

; ============================================================================
; ESP32-S3 CONFIGURATION (Primary sensor nodes)
; ============================================================================

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram = enable
monitor_filters = esp32_exception_decoder
build_flags =
    ${common.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D DEVICE_TYPE=DEVICE_ESP32_S3

; ============================================================================
; ESP32-S2-WROOM CONFIGURATION (Gateway/Serial-to-Ethernet)
; ============================================================================

[env:esp32-s2-wroom]
board = esp32-s2-wroom
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder
build_flags =
    ${common.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S2=1
    -D DEVICE_TYPE=DEVICE_ESP32_S2
    -D MODBUS_ENABLED=true

; ============================================================================
; DEBUG CONFIGURATION
; ============================================================================

[env:esp32-s3-devkitc-1-debug]
extends = env:esp32-s3-devkitc-1
debug_tool = esp-prog
debug_port = /dev/ttyACM0
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D DEBUG_LEVEL=DEBUG_VERBOSE

[env:esp32-s2-wroom-debug]
extends = env:esp32-s2-wroom
debug_tool = esp-prog
debug_port = /dev/ttyACM0
build_flags =
    ${env:esp32-s2-wroom.build_flags}
    -D DEBUG_LEVEL=DEBUG_VERBOSE

; ============================================================================
; RELEASE CONFIGURATION
; ============================================================================

[env:esp32-s3-devkitc-1-release]
extends = env:esp32-s3-devkitc-1
build_type = release
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D DEBUG_LEVEL=DEBUG_ERROR
    -O2

[env:esp32-s2-wroom-release]
extends = env:esp32-s2-wroom
build_type = release
build_flags =
    ${env:esp32-s2-wroom.build_flags}
    -D DEBUG_LEVEL=DEBUG_ERROR
    -O2

; ============================================================================
; CUSTOM TARGETS
; ============================================================================

[targets]
; Upload to all devices
upload_all =
    pio run -t upload -e esp32-s3-devkitc-1
    pio run -t upload -e esp32-s2-wroom

; Monitor all devices
monitor_all =
    pio device monitor -e esp32-s3-devkitc-1 -b 115200
    ; pio device monitor -e esp32-s2-wroom -b 115200

; Build all variants
build_all =
    pio run -e esp32-s3-devkitc-1
    pio run -e esp32-s2-wroom
    pio run -e esp32-s3-devkitc-1-release
    pio run -e esp32-s2-wroom-release

; Clean all
clean_all =
    pio run -t clean

; ============================================================================
; ENVIRONMENT VARIABLES
; ============================================================================

[env]
; Upload method (change as needed)
upload_method = uart
; upload_port = /dev/ttyACM0
; upload_speed = 921600

; For OTA updates (future)
; upload_protocol = espota
; upload_port = 192.168.30.11
; upload_speed = 

; ============================================================================
; NOTES
; ============================================================================
; 
; 1. For MLX90640 support, uncomment the appropriate library in lib_deps
; 2. For production, use the -release variants
; 3. For debugging, use the -debug variants
; 4. Adjust upload_port to match your device
; 5. For USR-TCP232, enable MODBUS_ENABLED in config_unified.h
; 
; To build and upload:
;   pio run -t upload -e esp32-s3-devkitc-1
; 
; To monitor:
;   pio device monitor -e esp32-s3-devkitc-1 -b 921600
; 
; ============================================================================
